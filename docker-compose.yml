services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinelsoc
      POSTGRES_USER: sentinelsoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelsoc -d sentinelsoc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [soc-internal]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      LAB_HOST: 0.0.0.0
      LAB_PORT: 8000
      LAB_DATABASE_URL: postgresql://sentinelsoc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sentinelsoc
      LAB_USE_MIGRATIONS: "true"
      LAB_COOKIE_SECURE: "false"
      LAB_TRUSTED_LOOPBACK_PROXY: "true"
      LAB_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      LAB_NMAP_ALLOWED_CIDRS: ${LAB_NMAP_ALLOWED_CIDRS:-}
      LAB_SENSOR_LOG_DIRS: /var/lib/sentinelsoc/sensors
      SENTINELSOC_SPLUNK_HEC_URL: ${SENTINELSOC_SPLUNK_HEC_URL:-}
      SENTINELSOC_SPLUNK_HEC_TOKEN: ${SENTINELSOC_SPLUNK_HEC_TOKEN:-}
      SENTINELSOC_ELASTICSEARCH_URL: ${SENTINELSOC_ELASTICSEARCH_URL:-}
      SENTINELSOC_ELASTICSEARCH_API_KEY: ${SENTINELSOC_ELASTICSEARCH_API_KEY:-}
      SENTINELSOC_ELASTICSEARCH_INDEX: ${SENTINELSOC_ELASTICSEARCH_INDEX:-sentinelsoc-events}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
      - ${LAB_SENSOR_LOG_MOUNT:-./sensor-logs}:/var/lib/sentinelsoc/sensors:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [soc-internal]
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_API_PROXY_TARGET: http://api:8000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [soc-internal, frontend-ingress]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  backend-data:

networks:
  soc-internal:
    internal: true
  frontend-ingress:
